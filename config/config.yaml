project:
  name: Airtime Bias
  package: airtime_bias
  description: Computer vision for narrative airtime analysis in reality TV.

paths:
  data_dir: data
  raw_video_dir: data/raw/videos
  references_dir: data/references/participants
  interim_dir: data/interim
  processed_dir: data/processed
  validation_dir: data/validation

scene_detection:
  detector: content
  threshold: 44.0
  min_scene_len_seconds: 2.0

frame_sampling:
  frame_positions:
    - start
    - middle
    - end
  edge_margin_seconds: 0.25
  jpeg_quality: 85
  max_width: null
  development_max_scenes: 50

face_detection:
  model_selection: 0
  min_detection_confidence: 0.50
  min_suppression_threshold: 0.30
  use_middle_prefilter: true
  prefilter_min_face_area_ratio: 0.02
  prefilter_max_center_distance: 0.55
  prefilter_max_faces: 1

commentary_detection:
  min_duration_seconds: 2.0
  min_face_area_ratio: 0.04
  max_center_distance: 0.35
  candidate_threshold: 0.70
  review_threshold: 0.50
  score_weights:
    face_presence: 0.30
    single_face: 0.20
    face_area: 0.20
    centering: 0.15
    stability: 0.10
    duration: 0.05

identity_matching:
  min_identity_confidence: 0.60
  unknown_label: unknown
