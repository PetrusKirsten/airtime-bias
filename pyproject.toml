[project]
name = "airtime-bias"
version = "0.1.0"
description = "Computer vision and media analytics pipeline for investigating narrative airtime patterns in reality TV."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.36",
    "opencv-python>=4.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "scenedetect[opencv]>=0.6",
    "mediapipe>=0.10"
]

[project.optional-dependencies]
ocr = [
    "easyocr>=1.7.2"
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "ipykernel>=6.29"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
